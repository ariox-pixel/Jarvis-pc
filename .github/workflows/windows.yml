name: Build EXE Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa le librerie
        run: npm install

      - name: Costruisci il programma
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mostra cosa e stato creato
        shell: pwsh
        run: Get-ChildItem dist -Filter *.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: dist/*.exe
          if-no-files-found: error
